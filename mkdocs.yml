site_name: ComfyUI-JH-PixelPro
site_description: Pro-grade retouch, colour and mask tools for ComfyUI, GPU-accelerated with Kornia.
site_url: https://jetthuangai.github.io/ComfyUI-JH-PixelPro/
repo_url: https://github.com/jetthuangai/ComfyUI-JH-PixelPro
repo_name: jetthuangai/ComfyUI-JH-PixelPro

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/camera-iris
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: vi
          name: Tiếng Việt
          build: true
          site_description: Bộ công cụ retouch, màu và mask chuyên nghiệp cho ComfyUI, tăng tốc GPU với Kornia.
          nav_translations:
            Home: Trang chủ
            Get started: Bắt đầu
            Quickstart: Hướng dẫn nhanh
            Examples: Ví dụ
            Overview: Tổng quan
            LUT Preset Gallery: Thư viện LUT Preset
            Skin Tone Retouch Chain: Chuỗi retouch tông da
            Nodes: Các node
            Color & Tone: Màu & tông
            Masks: Mask
            Face: Khuôn mặt
            Compositing: Ghép ảnh
            Filters: Bộ lọc
            Geometry: Hình học
            Looks: Look màu
            QA: Kiểm tra chất lượng

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - Examples: examples/index.md
      - LUT Preset Gallery: examples/lut-preset-gallery.md
      - Skin Tone Retouch Chain: examples/skin-tone-retouch.md
  - Nodes:
      - Color & Tone:
          - Overview: categories/color.md
          - Color Matcher: nodes/color-matcher.md
          - Color Matcher Region: nodes/color-matcher-region.md
          - ColorLab: nodes/color-lab.md
          - CLAHE Local Contrast: nodes/clahe-local-contrast.md
          - Tone Curve: nodes/tone-curve.md
          - Hue/Saturation per Range: nodes/hue-saturation-range.md
          - Luminosity Masking: nodes/luminosity-masking.md
          - Saturation Mask: nodes/saturation-mask.md
          - LUT Preset: nodes/lut-preset.md
          - LUT Import: nodes/lut-import.md
          - LUT Export: nodes/lut-export.md
          - HALD Identity: nodes/hald-identity.md
          - Tone Match LUT: nodes/tone-match-lut.md
      - Masks:
          - Overview: categories/mask.md
          - Sub-Pixel Mask Refiner: nodes/sub-pixel-mask-refiner.md
          - Edge-Aware Mask Refiner: nodes/edge-aware-mask-refiner.md
          - Alpha Matte: nodes/alpha-matte.md
          - Trimap Builder: nodes/trimap-builder.md
          - Mask Morphology: nodes/mask-morphology.md
          - Mask Combine: nodes/mask-combine.md
          - Mask Edge Smoother: nodes/mask-edge-smoother.md
          - Mask Cleanup: nodes/mask-cleanup.md
          - Mask Preview: nodes/mask-preview.md
          - Detail Mask: nodes/high-freq-detail-masker.md
      - Face:
          - Overview: categories/face.md
          - Face Detect: nodes/face-detect.md
          - Face Detect Lite: nodes/face-detect-lite.md
          - Face Landmarks: nodes/face-landmarks.md
          - Face Warp: nodes/face-warp.md
          - Face Warp TPS: nodes/face-warp-tps.md
          - Unwrap Face: nodes/unwrap-face.md
          - Face Beauty Blend: nodes/face-beauty-blend.md
          - Skin Tone Tri-Region: nodes/skin-tone-tri-region.md
      - Compositing:
          - Overview: categories/compositing.md
          - Layer Stack Start: nodes/layer-stack-start.md
          - Layer Add: nodes/layer-add.md
          - Layer Group: nodes/layer-group.md
          - Layer Flatten: nodes/layer-flatten.md
          - Pyramid Blend: nodes/pyramid-blend.md
      - Filters:
          - Overview: categories/filters.md
          - Frequency Separation: nodes/frequency-separation.md
          - Skin Smoother: nodes/edge-aware-smoother.md
          - Smart Sharpen: nodes/smart-sharpen.md
      - Geometry:
          - Overview: categories/geometry.md
          - Facial Aligner: nodes/facial-aligner.md
          - Lens Distortion: nodes/lens-distortion.md
          - Auto Align: nodes/auto-align.md
      - Looks:
          - Overview: categories/looks.md
          - Look Select: nodes/look-select.md
      - QA:
          - Overview: categories/qa.md
          - QA Image Diff: nodes/qa-image-diff.md
